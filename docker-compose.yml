services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/radar.db
      - PROFILE_PATH=/app/profile/cv.md
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    volumes:
      - ./frontend:/app/frontend:ro
      - ./profile:/app/profile:ro
      - radar-data:/app/data

volumes:
  radar-data:
